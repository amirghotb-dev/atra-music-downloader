name: Auto Music Scraper & Telegram Sync

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (optional)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual run from GitHub UI with custom search query or URL
    inputs:
      target:
        description: 'YouTube Music URL, Artist URL, SoundCloud, or Search Query (e.g. "https://music.youtube.com/@chavoshiofficial" or "Mohsen Chavoshi")'
        required: true
        default: 'https://music.youtube.com/@chavoshiofficial'
      limit:
        description: 'Number of tracks to scrape and upload'
        required: false
        default: '5'

# Cancel previous queued or stuck runs if a new one is triggered
concurrency:
  group: music-scraper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install -U "yt-dlp[default]" requests curl_cffi

      - name: Run Scraper & Upload to Telegram + Site API
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          cd scrapers/soundcloud
          TARGET="${{ github.event.inputs.target || 'persian music 2026' }}"
          LIMIT="${{ github.event.inputs.limit || '5' }}"
          python cli.py telegram-sync "$TARGET" --limit "$LIMIT"
