name: Auto Music Scraper & Telegram Sync

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (optional)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual run from GitHub UI with custom search query or URL
    inputs:
      target:
        description: 'Artist name, Query, SoundCloud URL, or YouTube URL (e.g. "Mohsen Chavoshi" or "https://soundcloud.com/...")'
        required: true
        default: 'Mohsen Chavoshi'
      source:
        description: 'Source Platform: soundcloud (recommended for cloud), auto, youtube, direct'
        required: false
        default: 'soundcloud'
      limit:
        description: 'Number of tracks to scrape and upload'
        required: false
        default: '5'

# Cancel previous queued or stuck runs if a new one is triggered
concurrency:
  group: music-scraper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Deno (JS runtime for YouTube bot verification)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install -U "yt-dlp[default]" requests curl_cffi mutagen beautifulsoup4

      - name: Run Scraper & Upload to Telegram + Site API
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          cd scrapers/soundcloud
          TARGET="${{ github.event.inputs.target || 'Mohsen Chavoshi' }}"
          LIMIT="${{ github.event.inputs.limit || '5' }}"
          SOURCE="${{ github.event.inputs.source || 'soundcloud' }}"
          python cli.py telegram-sync "$TARGET" --limit "$LIMIT" --source "$SOURCE"
